name: MIRVIX GEO Tools Production Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-tools-smoke.yml'
      - 'netlify/functions/competitor-products.mjs'
      - 'tools/index.html'
      - 'assets/geo-tools.js'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production page and public comparison API
        run: |
          node --input-type=module <<'NODE'
          const site = 'https://mirvixai.com';
          const page = await fetch(site+'/tools/');
          const html = await page.text();
          if(!page.ok||!html.includes('compare-form')||!html.includes('geo-tools.js')){
            throw new Error('GEO Tools page not deployed or missing comparison form');
          }
          const result = await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'Content-Type':'application/json','Origin':'https://external.example'},
            body:JSON.stringify({action:'compare',mode:'full',urls:[
              site+'/tools/',site+'/tariffs/'
            ]})
          });
          const data = await result.json();
          console.log('Protected comparison probe HTTP '+result.status+'; code '+String(data.error||data.status||'no error').slice(0,180));
          if(result.status!==403||!data.error)
            throw new Error('Full comparison must reject requests without authorized site origin');
          const allowedOrigin='https://mirvixai.com';
          const noCookieFull=await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'Content-Type':'application/json','Origin':allowedOrigin},
            body:JSON.stringify({action:'compare',mode:'full',urls:[site+'/tools/',site+'/tariffs/']})
          });
          if(![403,503].includes(noCookieFull.status))
            throw new Error('Full report without paid browser identity returned unexpected HTTP '+noCookieFull.status);
          console.log('Full report without purchase rejected: HTTP '+noCookieFull.status);
          const demo=await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'Content-Type':'application/json','Origin':allowedOrigin},
            body:JSON.stringify({action:'compare',mode:'preview',urls:[site+'/tools/',site+'/tariffs/']})
          });
          const demoData=await demo.json();
          console.log('First anonymous preview HTTP '+demo.status+'; '+String(demoData.error||demoData.notice||'').slice(0,150));
          if(demo.status===503)throw new Error('Anonymous preview not configured; set MIRVIX_TOOLS_SESSION_SECRET or MIRVIX_CABINET_SESSION_SECRET in Netlify.');
          if(!demo.ok||!demoData.preview||demoData.pages?.length!==2)
            throw new Error('One-time preview did not return a limited two-card sample.');
          const cookie=(demo.headers.get('set-cookie')||'').split(';')[0];
          if(!cookie.includes('__Host-mirvix_tools_visitor='))throw new Error('Signed visitor cookie missing');
          const repeat=await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'Content-Type':'application/json','Origin':allowedOrigin,'Cookie':cookie},
            body:JSON.stringify({action:'compare',mode:'preview',urls:[site+'/tools/',site+'/tariffs/']})
          });
          console.log('Repeat preview HTTP '+repeat.status);
          if(repeat.status!==402)throw new Error('Repeat free preview was not blocked by the server');
          console.log('Production GEO Tools available; repeat-free-trial and unpaid-report access blocked.');

          NODE
