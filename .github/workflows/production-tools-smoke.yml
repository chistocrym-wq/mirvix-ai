name: MIRVIX GEO Tools Production Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-tools-smoke.yml'
      - 'netlify/functions/competitor-products.mjs'
      - 'tools/index.html'
      - 'assets/geo-tools.js'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production page and public comparison API
        run: |
          node --input-type=module <<'NODE'
          const site = 'https://mirvixai.com';
          const page = await fetch(site+'/tools/');
          const html = await page.text();
          if(!page.ok||!html.includes('compare-form')||!html.includes('geo-tools.js')){
            throw new Error('GEO Tools page not deployed or missing comparison form');
          }
          const result = await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'compare',urls:[
              site+'/tools/',site+'/tariffs/'
            ]})
          });
          const text = await result.text();
          let data;
          try{data=JSON.parse(text)}catch{throw new Error('Comparison endpoint returned non-JSON HTTP '+result.status);}
          if(!result.ok)throw new Error('Comparison endpoint HTTP '+result.status+': '+data.error);
          if(data.pages?.length!==2||typeof data.successful!=='number')throw new Error('Malformed comparison response');
          if(!Array.isArray(data.comparisons)||data.comparisons[0]?.comparable!==false)
            throw new Error('Unverified prices must never be comparable');
          console.log('Production GEO Tools and comparison API responded; '+data.successful+' public pages read.');
          NODE
