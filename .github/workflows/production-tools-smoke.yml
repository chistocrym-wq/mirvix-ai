name: MIRVIX tools production smoke — request-only catalogue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-tools-smoke.yml'
      - 'netlify/functions/competitor-products.mjs'
      - 'tools/index.html'
      - 'netlify/functions/mirvix-lead.mjs'
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify request-only tools, paid preview restriction and real GEO tariffs
        run: |
          node --input-type=module <<'NODE'
          const site='https://mirvixai.com';
          const wait=async()=>{for(let i=0;i<25;i++){
            try{
              const r=await fetch(site+'/tools/',{cache:'no-store'});
              const html=await r.text();
              if(r.ok&&html.includes('tools-request-form')&&html.includes('data-service="product-comparison"'))return html;
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,6000));
          }throw Error('Request-only tools page not yet live on Production');};
          const html=await wait();
          if(html.includes('id="compare-form"')||html.includes('490 ₽'))throw Error('Old paid self-comparison UI is still public');
          for(const price of ['50 000','89 000','129 000','259 000']){
            const t=await fetch(site+'/tariffs/',{cache:'no-store'}).then(r=>r.text());
            if(!t.includes(price))throw Error('Missing GEO tariff '+price);
          }
          const r=await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'content-type':'application/json',origin:'https://external.example'},
            body:JSON.stringify({action:'compare',mode:'full',urls:[site+'/tools/',site+'/tariffs/']})});
          if(r.status!==403)throw Error('Unauthenticated cross-origin paid comparison allowed HTTP '+r.status);
          const blocked=await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'content-type':'application/json',origin:site},
            body:JSON.stringify({action:'compare',mode:'preview',urls:[site+'/tools/',site+'/tariffs/']})});
          if(blocked.status!==410)throw Error('Old self-service preview not disabled HTTP '+blocked.status);
          console.log('Production public tools OK. No self-service paid preview and no old price widget.');
          NODE
