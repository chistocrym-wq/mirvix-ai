name: MIRVIX GEO Tools Production Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-tools-smoke.yml'
      - 'netlify/functions/competitor-products.mjs'
      - 'tools/index.html'
      - 'assets/geo-tools.js'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production page and public comparison API
        run: |
          node --input-type=module <<'NODE'
          const site = 'https://mirvixai.com';
          const page = await fetch(site+'/tools/');
          const html = await page.text();
          if(!page.ok||!html.includes('compare-form')||!html.includes('geo-tools.js')){
            throw new Error('GEO Tools page not deployed or missing comparison form');
          }
          const result = await fetch(site+'/.netlify/functions/competitor-products',{
            method:'POST',headers:{'Content-Type':'application/json','Origin':'https://external.example'},
            body:JSON.stringify({action:'compare',mode:'full',urls:[
              site+'/tools/',site+'/tariffs/'
            ]})
          });
          const data = await result.json();
          console.log('Protected comparison probe HTTP '+result.status+'; code '+String(data.error||data.status||'no error').slice(0,180));
          if(result.status!==403||!data.error)
            throw new Error('Full comparison must reject requests without authorized site origin');
          console.log('Production GEO Tools is available and unauthenticated full API bypass is blocked.');
          NODE
