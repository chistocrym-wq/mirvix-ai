name: MIRVIX GEO Check
on:
  pull_request:
    paths:
      - 'netlify/functions/site-audit.mjs'
      - 'check/**'
      - 'tests/geo-check.test.mjs'
      - '.github/workflows/geo-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check netlify/functions/site-audit.mjs
          node --check tests/geo-check.test.mjs
      - name: Run safety and HTML extraction tests
        run: node --test tests/geo-check.test.mjs
