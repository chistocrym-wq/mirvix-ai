name: Build premium MIRVIX ocean video
on:
  push:
    branches:
      - main
      - feature/intelligence-evidence-source-repair-20261112
    paths:
      - '.github/workflows/build-mirvix-ocean.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  render-ocean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Get real sea-wave footage
        run: |
          set -euo pipefail
          # Mixkit preview URLs reject automated downloads with HTTP 403.
          # Download from the Pexels CDN under its free footage license.
          sources=(
            'https://videos.pexels.com/video-files/5038048/5038048-hd_1920_1080_30fps.mp4'
            'https://videos.pexels.com/video-files/19912847/19912847-hd_1920_1080_30fps.mp4'
            'https://videos.pexels.com/video-files/34754995/14733332_640_360_24fps.mp4'
          )
          ok=0
          for source in "${sources[@]}"; do
            echo "Trying public ocean-footage provider: ${source%%/video-files/*}"
            if curl -fL --retry 1 --connect-timeout 15 --max-time 100 \
                --user-agent 'Mozilla/5.0' "$source" -o /tmp/mirvix-source.mp4 && \
               ffprobe -v error /tmp/mirvix-source.mp4 >/dev/null 2>&1; then
              ok=1; break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo 'No licensed wave source could be downloaded; do not publish fake background video.' >&2
            exit 1
          fi
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 /tmp/mirvix-source.mp4
      - name: Render own website asset (real wave, turquoise, no sky)
        run: |
          set -euo pipefail
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y -ss 0.1 -i /tmp/mirvix-source.mp4 -t 22 \
            -vf 'crop=iw:ih*0.68:0:ih*0.32,scale=1600:900:force_original_aspect_ratio=increase,crop=1600:900,setpts=2.5*(PTS-STARTPTS),fps=24,eq=saturation=1.38:contrast=1.03:brightness=0.052:gamma=1.09,format=yuv420p' \
            -c:v libx264 -preset medium -b:v 4400k -maxrate 4900k -bufsize 9000k -movflags +faststart -an \
            assets/mirvix-ocean-premium.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.8 -i assets/mirvix-ocean-premium.mp4 \
            -frames:v 1 -q:v 3 assets/mirvix-ocean-premium-poster.jpg
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/mirvix-ocean-premium.mp4
          test -s assets/mirvix-ocean-premium.mp4
          test -s assets/mirvix-ocean-premium-poster.jpg
      - name: Commit real wave assets
        run: |
          set -euo pipefail
          git config user.name 'mirvix-ocean-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/mirvix-ocean-premium.mp4 assets/mirvix-ocean-premium-poster.jpg
          if git diff --cached --quiet; then
            echo 'No new media changes'
            exit 0
          fi
          git commit -m 'media(ocean): store real slow turquoise wave video and poster for MIRVIX homepage'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
