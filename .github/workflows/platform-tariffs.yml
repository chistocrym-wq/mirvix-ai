name: MIRVIX platform screenshots and tariffs
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tariffs/**'
      - 'sitemap.xml'
      - 'tests/platform-tariffs.test.mjs'
      - '.github/workflows/platform-tariffs.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tariffs/**'
      - 'sitemap.xml'
      - 'tests/platform-tariffs.test.mjs'
      - '.github/workflows/platform-tariffs.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify markup and pricing
        run: node --test tests/platform-tariffs.test.mjs
